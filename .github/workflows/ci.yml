name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to a PR makes the first run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      # The pricing and dispatch suites. These assert against figures published
      # independently of this code, so a failure here means the code and the
      # pricelist have drifted apart.
      #
      # Run TWICE, in two zones. Scheduling and due dates resolve against
      # America/Chicago no matter where the process runs, and the only honest
      # way to keep that true is to run the suite somewhere it would break if
      # it stopped being true. Pinning TZ to one value in the config would
      # hide exactly the bug this guards.
      - run: npm run test:zones

      # Demo mode is already the default with no Supabase config, but say it
      # explicitly so the build cannot start depending on real credentials.
      - run: npm run build
        env:
          DEMO_MODE: "1"

  migrations:
    name: Migrations and SQL price book
    # PostgreSQL 16 packages are available on this supported Ubuntu release.
    # ubuntu-latest can move to a release that no longer carries that client.
    runs-on: ubuntu-24.04

    # The other half of the drift check: all 27 quote totals are asserted in
    # SQL as well as in TypeScript, so the two implementations cannot diverge
    # silently. See docs/decisions.md.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      # The runner image ships a psql client, but not necessarily one matching
      # the server. Install the v16 client so migrations apply against 16.
      - name: Install PostgreSQL 16 client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-16

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: ./scripts/verify-migrations.sh

      - name: Verify completion invoice ordering
        run: psql -v ON_ERROR_STOP=1 -d spotless_verify -f scripts/verify-completion-invoicing.sql

      - name: Verify read-only client projections
        run: psql -v ON_ERROR_STOP=1 -d spotless_verify -f scripts/verify-client-projection-access.sql

      - name: Verify private Cleaner offer projection
        run: psql -v ON_ERROR_STOP=1 -d spotless_verify -f scripts/verify-cleaner-live-offers.sql

      - name: Verify Client feedback and tip receipts
        run: psql -v ON_ERROR_STOP=1 -d spotless_verify -f scripts/verify-client-feedback.sql

      - name: Verify concurrent Client feedback and settlement
        run: bash scripts/verify-client-feedback-races.sh spotless_verify

      - name: Verify reviewed collection balances
        run: psql -v ON_ERROR_STOP=1 -d spotless_verify -f scripts/verify-reviewed-collection.sql

      - name: Verify unresolved payment claims survive local expiry
        run: psql -v ON_ERROR_STOP=1 -d spotless_verify -f scripts/verify-unresolved-payment-claims.sql

      - name: Verify Management release of unconfirmed payment claims
        run: psql -v ON_ERROR_STOP=1 -d spotless_verify -f scripts/verify-released-payment-claims.sql

      - name: Verify assigned photo receipts and invoice evidence
        run: psql -v ON_ERROR_STOP=1 -d spotless_verify -f scripts/verify-photo-receipts.sql

      - name: Verify reviewed Management service drafts
        run: psql -v ON_ERROR_STOP=1 -d spotless_verify -f scripts/verify-service-draft.sql

      - name: Verify concurrent Management draft preparation
        run: bash scripts/verify-service-draft-races.sh spotless_verify

      - name: Verify frozen visit room scopes and role access
        run: psql -v ON_ERROR_STOP=1 -d spotless_verify -f scripts/verify-visit-room-scope.sql

      - name: Verify reviewed manual invoice issuance
        run: psql -v ON_ERROR_STOP=1 -d spotless_verify -f scripts/verify-invoice-issuance.sql

      - name: Verify concurrent invoice issuance
        run: bash scripts/verify-invoice-issue-races.sh spotless_verify

      - name: Verify version-bound capture receipts
        run: psql -v ON_ERROR_STOP=1 -d spotless_verify -f scripts/verify-photo-capture-versions.sql

      - name: Verify concurrent capture versions and object replacement
        run: bash scripts/verify-photo-capture-races.sh spotless_verify

      - name: Verify office payment review access
        run: psql -v ON_ERROR_STOP=1 -d spotless_verify -f scripts/verify-payment-review-access.sql

  matching_worker:
    name: Matching worker runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.4
      - name: Build the worker from actual application modules
        run: |
          node scripts/build-matching-worker.mjs --output /tmp/heyspotless-matching-worker --project-ref abcdefghijklmnopqrst --app-origin https://preview.example.test --source-version ${{ github.event.pull_request.head.sha || github.sha }} --preview true
      - name: Check the deployed runtime and dependencies
        run: deno check --config /tmp/heyspotless-matching-worker/deno.json /tmp/heyspotless-matching-worker/index.js
